name: Daily Paper Update

on:
  schedule:
    # 主跑：UTC 06:17 = 北京时间 14:17
    # 避开整点（GitHub 调度器在 :00 最拥堵，容易延迟甚至直接跳过）
    - cron: '17 6 * * *'
    # 兜底：UTC 10:17 = 北京时间 18:17，若主跑未触发或失败则补一次
    - cron: '17 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'src/data/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-index-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Fetch from OpenAlex
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SYNC_MODE: rescan
          DISPLAY_YEARS: '5'
        run: python -m scripts.fetch_papers
      - name: Export JSON
        run: python -m scripts.export_json
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.db src/data/papers.json src/data/meta.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(data): daily update $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main
            git push
          fi

  build:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
